version: 2

updates:
  - package-ecosystem: npm
    directory: /dsh-plugin
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      development-dependencies:
        dependency-type: development
    # react-dom must stay on React 18: peerDependencies pins react ^18.2.0,
    # and React 19's react-dom requires React 19 internals (CI test crash).
    ignore:
      - dependency-name: react-dom
        update-types: ['version-update:semver-major']
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope
