name: Build platform packages

# 插件本体是纯 JavaScript，无原生依赖与平台二进制，Windows/Linux 的 lib/
# 逐字节相同。分平台产出的差异只在随包的 PLATFORM.md 与 skillhub.json
# 路径模板；在各自 runner 上跑完整测试，是为了验证平台兼容性。

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package (${{ matrix.platform }}, Node.js ${{ matrix.node }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: dsh-plugin
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            label: win32-x64
            runner: windows-latest
            node: 22
          - platform: linux
            label: linux-x64
            runner: ubuntu-latest
            node: 22

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.17.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: dsh-plugin/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Type check
        run: pnpm typecheck

      - name: Test and build
        id: test
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee test-output.log

      - name: Report test failures
        if: failure() && steps.test.outcome == 'failure'
        run: |
          echo "::group::${{ matrix.platform }} test output"
          grep -E '^(not ok|# Subtest|# tests|# pass|# fail|  error:|  code:|  stack:|# .*Error|.*TypeError|.*ENOENT|.*EPERM)' test-output.log | head -80 || tail -80 test-output.log
          echo "::endgroup::"
          # 把尾部输出写进 step summary：checks API 无需管理员权限即可读取。
          {
            echo "### ${{ matrix.platform }} test failure tail"
            echo '```text'
            tail -60 test-output.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Pack ${{ matrix.platform }} artifact
        id: pack
        env:
          PACK_DEST: ${{ github.workspace }}/dist/${{ matrix.label }}
          PLATFORM: ${{ matrix.platform }}
          LABEL: ${{ matrix.label }}
        run: node scripts/verify-platform-pack.mjs

      - name: Upload ${{ matrix.platform }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: skillhub-plugin-${{ matrix.label }}
          path: |
            dist/${{ matrix.label }}/*.tgz
            dist/${{ matrix.label }}/*.sha256
          if-no-files-found: error
          retention-days: 90
