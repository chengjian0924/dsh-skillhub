name: Build

# 插件是纯 JavaScript，无原生依赖与平台二进制，Windows/Linux 产出的 lib/
# 逐字节相同。这里不伪造“平台专有包”，而是在两个目标平台的 runner 上各跑
# 一遍 typecheck / test / build / pack，验证工具链兼容性，并产出带平台标签
# 与 SHA-256 的 artifact，便于离线分发与溯源。

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: dsh-plugin
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x64
          - os: windows-latest
            label: win32-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.17.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: dsh-plugin/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Type check
        run: pnpm typecheck

      # pnpm test 内部先执行 build（跨平台 Node 脚本），无需重复调用。
      - name: Test and build
        id: test
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee test-output.log

      - name: Report test failures
        if: failure() && steps.test.outcome == 'failure'
        run: |
          echo "::group::${{ matrix.label }} test output"
          grep -E '^(not ok|# Subtest|# tests|# pass|# fail|  error:|  code:|  stack:|# .*Error|.*TypeError|.*ENOENT|.*EPERM)' test-output.log | head -80 || tail -80 test-output.log
          echo "::endgroup::"
          {
            echo "### ${{ matrix.label }} test failure tail"
            echo '```text'
            tail -60 test-output.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Pack ${{ matrix.label }} artifact
        id: pack
        env:
          PACK_DEST: ${{ github.workspace }}/dist/${{ matrix.label }}
          PLATFORM_LABEL: ${{ matrix.label }}
        run: node scripts/pack-artifact.mjs

      - name: Upload ${{ matrix.label }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: skillhub-plugin-${{ matrix.label }}
          path: |
            dist/${{ matrix.label }}/*.tgz
            dist/${{ matrix.label }}/*.sha256
          if-no-files-found: error
          retention-days: 90
