name: Build

# 本插件为纯 JavaScript，无原生依赖与平台二进制，Windows/Linux 构建出的
# tgz 内容等价。分平台构建的目的：
#   1. 在目标平台跑完整 typecheck/test/build/pack，验证平台兼容性；
#   2. 产出带平台标识的 artifact，便于离线分发与溯源。
# 因此这里不伪造“平台专有包”，只做平台构建验证与分发标记。

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: dsh-plugin
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x64
          - os: windows-latest
            label: win32-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.17.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: dsh-plugin/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Type check
        run: pnpm typecheck

      # pnpm test 内部先执行 build，无需重复调用。
      - name: Test and build
        run: pnpm test

      - name: Pack and verify
        id: pack
        env:
          PACK_DEST: ${{ github.workspace }}/dist/${{ matrix.label }}
        run: |
          set -euo pipefail
          mkdir -p "$PACK_DEST"
          bash scripts/check-pack.sh
          version=$(node -p "require('./package.json').version")
          src="$PACK_DEST/skillhub-plugin-$version.tgz"
          dst="$PACK_DEST/skillhub-plugin-$version-${{ matrix.label }}.tgz"
          mv "$src" "$dst"
          # 用 Node 计算摘要，避免 Windows Git Bash 缺少 sha256sum。
          node -e 'const fs=require("fs"),c=require("crypto");const f=process.argv[1];const h=c.createHash("sha256").update(fs.readFileSync(f)).digest("hex");fs.writeFileSync(f+".sha256",h+"  "+require("path").basename(f)+"\n")' "$dst"
          echo "--- artifact ---"
          cat "$dst.sha256"
          echo "artifact=$dst" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: skillhub-plugin-${{ matrix.label }}
          path: dist/${{ matrix.label }}/
          if-no-files-found: error
          retention-days: 90
