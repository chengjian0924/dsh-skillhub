name: Build platform packages

# 插件本体是纯 JavaScript，无原生依赖与平台二进制，Windows/Linux 的 lib/
# 逐字节相同。分平台产出的差异只在随包的 PLATFORM.md 与 skillhub.json
# 路径模板；在各自 runner 上跑完整测试，是为了验证平台兼容性。

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package (${{ matrix.platform }}, Node.js ${{ matrix.node }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: dsh-plugin
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            label: win32-x64
            runner: windows-latest
            node: 22
          - platform: linux
            label: linux-x64
            runner: ubuntu-latest
            node: 22

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.17.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: dsh-plugin/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Type check
        run: pnpm typecheck

      - name: Test and build
        id: test
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee test-output.log

      - name: Report test failures
        if: failure() && steps.test.outcome == 'failure'
        run: |
          echo "::group::${{ matrix.platform }} test output"
          grep -E '^(not ok|# Subtest|# tests|# pass|# fail|  error:|  code:|  stack:|# .*Error|.*TypeError|.*ENOENT|.*EPERM)' test-output.log | head -80 || tail -80 test-output.log
          echo "::endgroup::"
          # 把尾部输出写进 step summary：checks API 无需管理员权限即可读取。
          {
            echo "### ${{ matrix.platform }} test failure tail"
            echo '```text'
            tail -60 test-output.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Pack ${{ matrix.platform }} artifact
        id: pack
        env:
          PACK_DEST: ${{ github.workspace }}/dist/${{ matrix.label }}
        run: |
          set -euo pipefail
          mkdir -p "$PACK_DEST"
          node scripts/pack-platform.mjs ${{ matrix.platform }}

          version=$(node -p "require('./package.json').version")
          src="dist/skillhub-plugin-$version-${{ matrix.platform }}.tgz"
          dst="$PACK_DEST/skillhub-plugin-$version-${{ matrix.label }}.tgz"
          cp "$src" "$dst"

          # 先落盘清单：grep -q 会提前关闭管道，配合 pipefail 会让 tar 因 SIGPIPE 失败。
          tar -tzf "$dst" > "$PACK_DEST/manifest.txt"
          for f in PLATFORM.md skillhub.json.example lib/host.js lib/client.js cordis.patch.yml; do
            grep -qx "package/$f" "$PACK_DEST/manifest.txt" || { echo "missing in $dst: $f" >&2; exit 1; }
          done
          leaked=$(grep -E '^package/(src/|lib/tests/|node_modules/|\.env)' "$PACK_DEST/manifest.txt" || true)
          test -z "$leaked" || { echo "leaked: $leaked" >&2; exit 1; }

          node -e 'const fs=require("fs"),c=require("crypto");const f=process.argv[1];const h=c.createHash("sha256").update(fs.readFileSync(f)).digest("hex");fs.writeFileSync(f+".sha256",h+"  "+require("path").basename(f)+"\n")' "$dst"
          echo "--- artifact ---"
          cat "$dst.sha256"
          echo "artifact=$dst" >> "$GITHUB_OUTPUT"

      - name: Upload ${{ matrix.platform }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: skillhub-plugin-${{ matrix.label }}
          path: |
            dist/${{ matrix.label }}/*.tgz
            dist/${{ matrix.label }}/*.sha256
          if-no-files-found: error
          retention-days: 90
